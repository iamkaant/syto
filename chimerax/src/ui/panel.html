<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hit Picking Handbook</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1d21; --muted: #6b7280; --line: #e3e6ea;
    --card: #f7f8fa; --accent: #2563c9; --warn: #a2600a; --warn-bg: #fdf4e3;
    --good: #1f8a4c;
    --hbond: #5aa0ff; --salt: #eb6e3c; --stack: #be78e6; --cation: #f0b43c;
    --halogen: #3cc8aa; --phobic: #aaaaaa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1e23; --fg: #e6e8eb; --muted: #9aa3ae; --line: #2d323a;
      --card: #22262c; --accent: #6ba4f8; --warn: #e0b060; --warn-bg: #2e2718;
      --good: #5fd08a;
    }
  }
  /* Asked for outright, rather than inferred from the OS. The web page
     has a dark frame of its own and embeds this panel inside it, so
     following the viewer's system theme would put a white panel beside a
     dark 3D view on half the machines that open it. */
  :root[data-theme="dark"] {
    --bg: #1b1e23; --fg: #e6e8eb; --muted: #9aa3ae; --line: #2d323a;
    --card: #22262c; --accent: #6ba4f8; --warn: #e0b060; --warn-bg: #2e2718;
    --good: #5fd08a;
  }
  /* Controls that only mean something in ChimeraX, or that the web page
     owns itself. Showing them in both places gave two ways to do one
     thing, and the panel's copies did nothing at all in the browser: its
     line-width slider moved and then snapped back, because nothing on
     the other side of the bridge was listening. A control that does
     nothing is worse than no control. */
  :root[data-host="web"] .host-chimerax { display: none; }
  * { box-sizing: border-box; }
  /* Two columns once there is room for them. Docked in ChimeraX the panel is
     narrow and this stays a single column; detach it and widen it and the
     controls move beside the content instead of scrolling past it. */
  .grid { display: grid; gap: 0 20px; grid-template-columns: 1fr; }
  @media (min-width: 680px) {
    /* Exactly TWO columns, never three. Controls and the pose on the left;
       everything about what was clicked - the entry, the basicity scale and
       the torsion profile - together on the right, where it is read. A third
       column only made that block wrap underneath at ordinary widths. */
    .grid { grid-template-columns: minmax(250px, 0.85fr) minmax(340px, 1.15fr); }
    .grid > .col { min-width: 0; }
    body { padding-left: 18px; padding-right: 18px; }
    .col h2:first-child { border-top: none; padding-top: 0; }
    /* The right column used to be its own scroller: sticky, capped at
       100vh. But it starts below the title, the status card and the
       buttons, so a column exactly one viewport tall ran exactly that far
       past the bottom of the page - a page scrollbar AND a column
       scrollbar, side by side, the moment the scale plot was open.
       The settings fold away now, which leaves the left column short, so
       nothing is gained by scrolling the two independently. One page, one
       scrollbar. */
  }
  @media (min-width: 1180px) {
    .grid { grid-template-columns: minmax(280px, 0.7fr) minmax(460px, 1.3fr); }
  }
  body {
    margin: 0; padding: 12px 14px 32px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  h2 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
       color: var(--muted); margin: 18px 0 8px; font-weight: 600;
       border-top: 1px solid var(--line); padding-top: 12px; }
  h2:first-of-type { border-top: none; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 7px; padding: 10px 11px; margin-bottom: 9px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .spread { justify-content: space-between; }
  button {
    font: inherit; background: var(--card); color: var(--fg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .trow { padding:5px 6px; border-radius:6px; cursor:pointer;
          border:1px solid transparent; }
  .trow:hover { background:var(--line); }
  .trow.on { border-color:var(--accent); box-shadow:inset 3px 0 var(--accent); }
  .trow.warn b { color:var(--strain, #e08030); }
  .trow-h { display:flex; justify-content:space-between; gap:8px;
            align-items:baseline; }
  .trow + .trow { border-top:1px solid var(--line); border-radius:0; }
  label.chk { display: flex; align-items: center; gap: 7px; padding: 3px 0;
              cursor: pointer; user-select: none; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .muted { color: var(--muted); }
  .tiny { font-size: 11.5px; }
  .warn { background: var(--warn-bg); border-color: var(--warn);
          color: var(--warn); }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 4px 3px; vertical-align: top;
       border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  tr.ix { cursor: pointer; }
  tr.ix:hover td { background: var(--card); }
  .q { display: inline-block; width: 38px; height: 5px; border-radius: 3px;
       background: var(--line); overflow: hidden; vertical-align: middle; }
  .q > i { display: block; height: 100%; }
  .pill { font-size: 10.5px; padding: 1px 6px; border-radius: 20px;
          border: 1px solid var(--line); color: var(--muted); }
  .flag { color: var(--warn); font-size: 11.5px; }
  /* Settings fold away. They are set once at the start of a party and the
     pose above them is what gets looked at on every compound. Collapsed,
     the summary still reports what is on, so nothing has to be opened to
     find out. */
  .fold { margin: 18px 0 0; }
  .fold > summary {
    list-style: none; cursor: pointer; display: flex; align-items: baseline;
    gap: 8px; font-size: 12px; letter-spacing: .04em; font-weight: 600;
    text-transform: uppercase; color: var(--muted);
    border-top: 1px solid var(--line); padding: 12px 0 8px;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before {
    content: "\25B8"; font-size: 10px; transition: transform .12s ease;
    display: inline-block; color: var(--muted);
  }
  .fold[open] > summary::before { transform: rotate(90deg); }
  .fold > summary:hover { color: var(--fg); }
  .fold > summary .sum {
    margin-left: auto; font-style: normal; font-weight: 400;
    text-transform: none; letter-spacing: 0; font-size: 11.5px;
    color: var(--muted); text-align: right;
  }
  .fold[open] > summary .sum { opacity: .55; }
  .col > .fold:first-child > summary { border-top: none; padding-top: 0; }
  /* Scale tabs. pKBHX and pKBH+ answer different questions about the same
     atom, so they share one plot area rather than stacking two charts. */
  .tabs { display: flex; gap: 4px; margin: 0 0 6px; }
  .tabs .tab { font: inherit; font-size: 11.5px; padding: 3px 9px;
               border: 1px solid var(--line); background: transparent;
               color: var(--muted); border-radius: 5px; cursor: pointer; }
  .tabs .tab:hover { color: var(--fg); }
  .tabs .tab.on { background: var(--card); color: var(--fg);
                  border-color: var(--accent); font-weight: 600; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         font-size: 11.5px; }
  .entry { border-left: 2px solid var(--accent); padding-left: 9px;
           margin: 9px 0; }
  .entry h3 { font-size: 12.5px; margin: 0 0 3px; }
  .val { font-variant-numeric: tabular-nums; }
  .ref { font-size: 11px; color: var(--muted); word-break: break-all; }
  a { color: var(--accent); }
  .scale { margin: 6px 0 2px; }
  .scale svg { width: 100%; height: auto; display: block; }
  .scale .lbl { font-size: 8.5px; fill: var(--muted); }
  .scale .lbl.on { fill: var(--fg); font-weight: 600; }
  .scale .ax { font-size: 8px; fill: var(--muted); }
  .scale-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .band { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
          margin-right: 4px; vertical-align: middle; }
  .band.good { background: #1e8c46; }
  .band.marginal { background: #c88214; }
  .band.edge { background: #c83228; }
  .lim { color: var(--muted); font-size: 11px; }
  .legend { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
  .legend span { margin-right: 10px; white-space: nowrap; }
</style>
</head>
<body>

<h1>Hit Picking Handbook</h1>

<div id="status" class="card tiny muted">Connecting&hellip;</div>

<div class="row host-chimerax" style="gap:6px;margin-bottom:4px">
  <button class="primary" onclick="hp('analyze')">Analyse pose</button>
  <button onclick="hp('setup')">Re-read receptor</button>
</div>

<div class="grid">
<div class="col">

<h2>Current pose</h2>
<div id="pose"></div>

<details class="fold host-chimerax" id="fold-nci" ontoggle="hpRemember(this)">
  <summary><span>Interactions shown</span>
    <i class="sum" id="sum-nci"></i></summary>
<div class="card" id="toggles"></div>
</details>

<details class="fold host-chimerax" id="fold-display" ontoggle="hpRemember(this)">
  <summary><span>Display</span>
    <i class="sum" id="sum-display"></i></summary>
<div class="card">
  <label class="chk"><input type="checkbox" id="opt-lengths"
    onchange="hp('lengths',{on:this.checked?1:0})"> Lengths on interactions</label>
  <label class="chk"><input type="checkbox" id="opt-angles"
    onchange="hp('angles',{on:this.checked?1:0})"> Angles on interactions</label>
  <label class="chk"><input type="checkbox" id="opt-limits"
    onchange="hp('limits',{on:this.checked?1:0})">
    Show the limits in the labels</label>
  <label class="chk"><input type="checkbox" id="opt-clashes"
    onchange="hp('clashes',{on:this.checked?1:0})">
    <span class="swatch" style="background:#e64646"></span>
    Clashes and strain</label>
  <label class="chk"><input type="checkbox" id="opt-scale"
    onchange="hp('scaleplot',{on:this.checked?1:0})">
    Basicity scale plots</label>
  <label class="chk"><input type="checkbox" id="opt-hover"
    onchange="hp('hover',{on:this.checked?1:0})">
    Detail in the hover balloon</label>
  <label class="chk"><input type="checkbox" id="opt-autoexplain"
    onchange="hp('autoexplain',{on:this.checked?1:0})"
    title="Explain an atom in this panel as soon as it is selected">
    Explain an atom when it is selected</label>
  <label class="chk"><input type="checkbox" id="opt-reveal"
    onchange="hp('reveal',{on:this.checked?1:0})"
    title="Display the receptor residues the interactions point at. Unticking
hides only what this put on screen, not anything you displayed yourself."
    >Show the residues being contacted</label>
  <label class="chk" style="gap:9px">
    <input type="range" id="opt-width" min="0.02" max="0.2" step="0.005"
      style="flex:1" onchange="hp('width',{value:this.value})"
      oninput="document.getElementById('widthval').textContent =
               (+this.value).toFixed(3)">
    <span>Line width <b id="widthval">0.075</b></span></label>
  <div class="legend">
    <span><i class="band good"></i>within limits</span>
    <span><i class="band marginal"></i>off ideal</span>
    <span><i class="band edge"></i>only just inside</span>
  </div>
  <div class="row" style="margin-top:7px;gap:6px;flex-wrap:wrap">
    <button onclick="hp('labels',{quantity:'pKBHX'})"
      title="H-bond basicity: how well each atom accepts a hydrogen bond"
      >Label pK<sub>BHX</sub></button>
    <button onclick="hp('labels',{quantity:'pKBH+'})"
      title="Proton basicity: whether each atom is protonated at pH 7.4"
      >Label pK<sub>BH+</sub></button>
    <button onclick="hp('labels',{quantity:'off'})">Clear labels</button>
  </div>
</div>
</details>

<div id="torsions"></div>

</div><!-- /col -->
<div class="col right">

<h2>What you clicked</h2>
<div id="hit"><p class="empty">Ctrl-click an atom in the 3D view.</p></div>

</div><!-- /col -->
</div><!-- /grid -->

<script>
// ---------------------------------------------------------------- bridge
// ChimeraX: navigate to a custom scheme URL, caught by handle_scheme().
// Web: the same calls go over postMessage to the Pyodide worker. The panel
// itself does not know or care which host it is in.
// The host declares itself in the query string, not on window: a parent
// page cannot set a property on this frame before its own script runs, so
// anything passed that way would arrive one paint too late and the panel
// would come up in the wrong theme and correct itself in front of you.
var HP_Q = new URLSearchParams(location.search);
var HP_HOST = HP_Q.get("host") || window.hpHost || "chimerax";
if (HP_HOST !== "chimerax") {
  document.documentElement.setAttribute("data-host", HP_HOST);
}
if (HP_Q.get("theme")) {
  document.documentElement.setAttribute("data-theme", HP_Q.get("theme"));
}

function hp(action, params) {
  var q = [];
  for (var k in (params || {})) {
    q.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
  }
  var url = "hitpick:/" + action + (q.length ? "?" + q.join("&") : "");
  if (HP_HOST === "chimerax") {
    window.location.href = url;
  } else if (window.hpBridge) {
    window.hpBridge.call(action, params || {});
  }
}

var TYPES = [
  ["hbond",             "Hydrogen bonds",        "var(--hbond)"],
  ["hbond_charged",     "Charge-assisted H-bonds","var(--hbond)"],
  ["salt_bridge",       "Salt bridges",          "var(--salt)"],
  ["pi_stack_parallel", "Stacking (parallel)",   "var(--stack)"],
  ["pi_stack_tshaped",  "Stacking (T-shaped)",   "var(--stack)"],
  ["cation_pi",         "Cation&ndash;&pi;",     "var(--cation)"],
  ["halogen_bond",      "Halogen bonds",         "var(--halogen)"],
  ["weak_hbond",        "Weak C&ndash;H&middot;&middot;&middot;O", "var(--phobic)"],
  ["hydrophobic",       "Hydrophobic contacts",  "var(--phobic)"]
];

// Which settings folds are open. Kept in localStorage so reopening the
// panel - or restarting ChimeraX - does not put them back the way the
// author liked them rather than the way you left them. Every access is
// guarded: the store can be absent or throw in an embedded view, and the
// panel has to work either way.
var FOLD_DEFAULT = {"fold-nci": false, "fold-display": false};

function hpFoldState() {
  try {
    var raw = window.localStorage.getItem("hp.folds");
    if (raw) return JSON.parse(raw);
  } catch (e) { /* no store, or it refused: fall through to the default */ }
  return null;
}

function hpRemember(el) {
  try {
    var st = hpFoldState() || {};
    st[el.id] = el.open;
    window.localStorage.setItem("hp.folds", JSON.stringify(st));
  } catch (e) { /* not remembering is survivable; failing to toggle is not */ }
}

function hpRestoreFolds() {
  var st = hpFoldState() || FOLD_DEFAULT;
  Object.keys(FOLD_DEFAULT).forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.open = (id in st) ? !!st[id] : FOLD_DEFAULT[id];
  });
}

// A collapsed section that says nothing about its contents is a section
// people open just to check. These say what is on, so they do not have to.
function hpFoldSummary(s) {
  var o = s.options || {};
  var on = (o.enabled_nci || []).length;
  var el = document.getElementById("sum-nci");
  if (el) {
    el.textContent = on === TYPES.length
      ? "all " + TYPES.length
      : on + " of " + TYPES.length;
  }
  el = document.getElementById("sum-display");
  if (!el) return;
  var bits = [];
  if (o.show_lengths) bits.push("lengths");
  if (o.show_angles) bits.push("angles");
  if (o.show_clashes) bits.push("clashes");
  if (o.show_scale !== false) bits.push("scales");
  if (o.reveal_partners) bits.push("contacts shown");
  el.textContent = bits.length ? bits.join(", ") : "nothing extra";
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c];
  });
}

function qbar(q) {
  var pct = Math.round(Math.max(0, Math.min(1, q)) * 100);
  var col = q > 0.66 ? "var(--good)" : (q > 0.4 ? "var(--cation)" : "var(--salt)");
  return '<span class="q"><i style="width:' + pct + '%;background:' + col + '"></i></span>';
}

// ------------------------------------------------------------ rendering

window.hpSetState = function (s) {
  var st = document.getElementById("status");
  if (!s.ready) {
    st.className = "card tiny warn";
    st.innerHTML = HP_HOST === "chimerax"
      ? "No binding site prepared. Run <code>hitpick setup</code>."
      : "Load a receptor and a pose file to start.";
  } else {
    st.className = "card tiny muted";
    st.innerHTML = (s.handbook ? esc(s.handbook) : "handbook not built")
      + (s.viewdock ? " &middot; linked to ViewDock" : "");
  }

  var enabled = (s.options && s.options.enabled_nci) || [];
  var html = "";
  TYPES.forEach(function (t) {
    var on = enabled.indexOf(t[0]) >= 0;
    html += '<label class="chk"><input type="checkbox" ' + (on ? "checked" : "")
      + ' onchange="hp(\'toggle\',{kind:\'' + t[0] + '\',on:this.checked?1:0})">'
      + '<span class="swatch" style="background:' + t[2] + '"></span>'
      + t[1] + '</label>';
  });
  document.getElementById("toggles").innerHTML = html;

  if (s.options) {
    document.getElementById("opt-lengths").checked = !!s.options.show_lengths;
    document.getElementById("opt-angles").checked = !!s.options.show_angles;
    var oc = document.getElementById("opt-clashes");
    if (oc) oc.checked = !!s.options.show_clashes;
    var ol = document.getElementById("opt-limits");
    if (ol) ol.checked = !!s.options.show_limits;
    var os = document.getElementById("opt-scale");
    if (os) os.checked = s.options.show_scale !== false;
    var oh = document.getElementById("opt-hover");
    if (oh) oh.checked = s.options.hover_detail !== false;
    var oa = document.getElementById("opt-autoexplain");
    if (oa) oa.checked = s.options.handbook_on_click !== false;
    var orv = document.getElementById("opt-reveal");
    if (orv) orv.checked = !!s.options.reveal_partners;
    var ow = document.getElementById("opt-width");
    if (ow && typeof s.options.line_width === "number") {
      ow.value = s.options.line_width;
      document.getElementById("widthval").textContent =
        s.options.line_width.toFixed(3);
    }
  }

  hpFoldSummary(s);

  window.hpShowScale = s.options ? (s.options.show_scale !== false) : true;
  renderPose(s.pose);
  renderTorsions(s.torsions, s.torsion_warn_kcal);
  // kept so the scale tabs can re-render without a round trip
  window.hpLast = {hit: s.hit, scales: s.scales, torsion: s.torsion};
  renderHit(s.hit, s.scales || (s.scale ? [s.scale] : []), s.torsion);
};

// Every flagged torsion, worst first. This existed only as `hitpick
// torsions` in the log and as a word floating by a bond in 3D, neither of
// which can be read down. The two severity tiers are the point of the
// list: a torsion measured past the warning threshold is costing the pose
// real energy, while most flags are a geometric rule being careful.
function renderTorsions(rows, warnKcal) {
  var el = document.getElementById("torsions");
  if (!el) return;
  if (!rows || !rows.length) { el.innerHTML = ""; return; }

  var bad = rows.filter(function (r) { return r.severity === "warning"; });
  var sum = bad.length
    ? bad.length + " over " + (warnKcal || 3) + " kcal/mol"
    : rows.length + ", none serious";

  var body = rows.map(function (r) {
    var cls = "trow" + (r.severity === "warning" ? " warn" : "")
            + (r.selected ? " on" : "");
    var cost = (r.energy === null || r.energy === undefined)
      ? '<span class="tiny muted">not measured</span>'
      : "+" + r.energy.toFixed(1) + " kcal/mol";
    return '<div class="' + cls + '" onclick="hp(\'torsion\',{bond:\''
      + esc(r.bond) + '\'})" title="' + esc(r.note || "") + '">'
      + '<div class="trow-h"><b>' + esc(r.kind) + "</b>"
      + '<span class="tiny muted">' + esc(r.label) + "</span></div>"
      + '<div class="trow-h"><span class="tiny">' + esc(r.assessment)
      + " &middot; " + r.angle.toFixed(0) + "&deg;</span><span>"
      + cost + "</span></div></div>";
  }).join("");

  // This section is rebuilt on every pose, so hpRestoreFolds cannot reach
  // it. A choice the user made sticks; otherwise it opens itself when
  // something is actually serious and stays shut when nothing is.
  var remembered = (hpFoldState() || {})["fold-torsions"];
  var open = (remembered === undefined) ? bad.length > 0 : !!remembered;

  el.innerHTML = '<details class="fold" id="fold-torsions"'
    + (open ? " open" : "") + ' ontoggle="hpRemember(this)">'
    + '<summary><span>Torsions worth a look</span>'
    + '<i class="sum">' + esc(sum) + "</i></summary>"
    + '<div class="card" style="padding:4px 6px">' + body
    + '<div class="tiny muted" style="margin-top:6px">'
    + "Click a row to select the bond and plot its profile. "
    + "Orange is measured above " + (warnKcal || 3) + " kcal/mol above "
    + "that bond class&rsquo;s own minimum; the rest are a geometric rule "
    + "being careful, or a smaller measured cost.</div></div></details>";
}

function renderPose(p) {
  var el = document.getElementById("pose");
  if (!p) { el.innerHTML = '<p class="empty">Nothing analysed yet.</p>'; return; }
  var h = '<div class="card"><div class="row spread"><b>' + esc(p.name) + '</b>'
        + '<span class="pill">' + (p.interactions || []).length + ' shown</span></div>';
  if (p.strain) {
    var sc = p.strain;
    var bad = (sc.clashes || 0) + (sc.internal_clashes || 0);
    if (bad || sc.strain_flags) {
      h += '<div class="card warn tiny"><b>' + bad + ' clash'
        + (bad === 1 ? "" : "es");
      if (sc.severe_clashes) h += " (" + sc.severe_clashes + " severe)";
      if (sc.strain_flags) h += ", " + sc.strain_flags + " strain flag"
        + (sc.strain_flags === 1 ? "" : "s");
      h += "</b>";
      if (p.worst_overlap) {
        h += ' &middot; worst overlap ' + p.worst_overlap + "&nbsp;&Aring;";
      }
      h += "</div>";
    }
  }
  (p.warnings || []).forEach(function (w) {
    h += '<div class="flag" style="margin-top:6px">' + esc(w) + '</div>';
  });
  h += '</div>';

  if (!p.interactions || !p.interactions.length) {
    h += '<p class="empty">No interactions of the selected types.</p>';
  } else {
    h += '<table>';
    p.interactions.forEach(function (i) {
      var terms = [];
      var lim = i.limits || {};
      function band(v) {
        return v >= 0.55 ? "good" : (v >= 0.25 ? "marginal" : "edge");
      }
      var dband = band((i.components || {}).distance != null
                       ? i.components.distance : i.quality);
      terms.push('<i class="band ' + dband + '"></i>' + i.distance
        + "&nbsp;&Aring;"
        + (lim.distance ? ' <span class="lim">[' + lim.distance + "]</span>" : ""));
      for (var k in (i.angles || {})) {
        if (i.angles[k] === null) continue;
        var b = band((i.components || {})[k] != null ? i.components[k] : 1);
        terms.push('<i class="band ' + b + '"></i>' + esc(k) + " "
          + i.angles[k] + "&deg;"
          + (lim[k] ? ' <span class="lim">[' + lim[k] + "]</span>" : ""));
      }
      h += '<tr class="ix" onclick="hp(\'highlight\',{atoms:\''
        + (i.lig_atoms || []).concat(i.rec_atoms || []).join(",") + '\'})">'
        + '<td style="width:40px">' + qbar(i.quality) + '</td>'
        + '<td><b>' + esc(i.kind.replace(/_/g, " ")) + '</b><br>'
        + '<span class="val tiny">' + terms.join(" &nbsp; ") + "</span>"
        + '<br><span class="tiny muted">' + esc(i.label) + '</span>'
        + (i.flags || []).map(function (f) {
            return '<br><span class="flag">! ' + esc(f) + '</span>'; }).join("")
        + '</td></tr>';
    });
    h += '</table>';
  }
  el.innerHTML = h;
}

function renderScale(sc) {
  if (!sc || !sc.families || !sc.families.length) return "";
  var W = 430, L = 104, R = 10, rowH = 13, top = 16;
  var H = top + sc.families.length * rowH + 10;
  var lo = sc.min, hi = sc.max, span = (hi - lo) || 1;
  function x(v) { return L + (v - lo) / span * (W - L - R); }

  var p = ['<div class="scale"><svg viewBox="0 0 ' + W + " " + H
           + '" preserveAspectRatio="xMidYMin meet">'];

  // Axis ticks on a round step. One per unit suits pKBHX (span ~6) and
  // turns pKBH+ (span ~27) into a row of colliding numbers.
  var step = tickStep(span, 8);
  for (var t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) {
    p.push('<line x1="' + x(t) + '" y1="' + (top - 5) + '" x2="' + x(t)
      + '" y2="' + (H - 8) + '" stroke="var(--line)" stroke-width="1"/>');
    p.push('<text class="ax" x="' + x(t) + '" y="' + (top - 7)
      + '" text-anchor="middle">' + (+t.toFixed(2)) + '</text>');
  }

  // reference lines: pH 7.4 on the pKBH+ axis
  (sc.reference_lines || []).forEach(function (rl) {
    var rx = x(rl.value);
    p.push('<line x1="' + rx + '" y1="' + (top - 5) + '" x2="' + rx
      + '" y2="' + (H - 8) + '" stroke="var(--warn, #c98a00)" '
      + 'stroke-width="1.4" stroke-dasharray="4 3"><title>'
      + esc(rl.label + (rl.note ? " - " + rl.note : "")) + '</title></line>');
    p.push('<text class="ax" x="' + (rx + 3) + '" y="' + (top - 7)
      + '" fill="var(--warn, #c98a00)">' + esc(rl.label) + '</text>');
  });

  sc.families.forEach(function (f, i) {
    var y = top + i * rowH + rowH / 2;
    if (f.highlighted) {
      p.push('<rect x="0" y="' + (y - rowH / 2 + 1) + '" width="' + W
        + '" height="' + (rowH - 2)
        + '" fill="var(--accent)" opacity="0.10"/>');
    }
    // the family's span
    p.push('<line x1="' + x(f.min) + '" y1="' + y + '" x2="' + x(f.max)
      + '" y2="' + y + '" stroke="var(--line)" stroke-width="1.5"/>');
    // one tick per compound, as in the Laurence figure
    f.points.forEach(function (pt) {
      var col = f.highlighted ? "var(--accent)" : "var(--muted)";
      p.push('<line x1="' + x(pt.value) + '" y1="' + (y - 4) + '" x2="'
        + x(pt.value) + '" y2="' + (y + 4) + '" stroke="' + col
        + '" stroke-width="1.6" opacity="' + (pt.flagged ? 0.45 : 0.85)
        + '"><title>' + esc(pt.compound) + "  " + pt.value
        + (pt.flagged ? "  (flagged)" : "") + "</title></line>");
    });
    p.push('<text class="lbl' + (f.highlighted ? " on" : "") + '" x="'
      + (L - 6) + '" y="' + (y + 3) + '" text-anchor="end">'
      + esc(f.label) + "</text>");
  });

  // where this atom sits
  if (sc.marker) {
    var mx = x(sc.marker.value);
    p.push('<line x1="' + mx + '" y1="' + (top - 5) + '" x2="' + mx
      + '" y2="' + (H - 8)
      + '" stroke="var(--salt)" stroke-width="1.5" stroke-dasharray="3 2"/>');
    p.push('<text class="ax" x="' + mx + '" y="' + (H - 1)
      + '" text-anchor="middle" fill="var(--salt)">'
      + sc.marker.value + "</text>");
  }
  p.push("</svg></div>");

  var note = sc.marker
    ? "Marked: " + esc(sc.marker.compound || "this moiety") + " = "
      + sc.marker.value
    : "No parent-compound value for this moiety.";
  p.push('<div class="scale-note">' + note
    + ' &middot; hover a tick for the compound &middot; faded ticks are '
    + 'flagged for review</div>');

  // what the number means for the pose in front of you
  if (sc.verdict) {
    p.push('<div class="card tiny' + (sc.verdict.level === "cation"
        ? " warn" : "") + '"><b>' + sc.verdict.percent_protonated
      + '% protonated</b> &mdash; ' + esc(sc.verdict.text)
      + '<div class="muted">That is the parent compound\'s pK<sub>a</sub>. '
      + 'Substituents move it by log units, so check the actual ligand.</div>'
      + '</div>');
  }
  if (sc.caption) {
    p.push('<div class="scale-note muted">' + esc(sc.caption) + '</div>');
  }
  return p.join("");
}

function tickStep(span, maxTicks) {
  span = Math.abs(span) || 1;
  var raw = span / Math.max(1, maxTicks);
  var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var mults = [1, 2, 5, 10];
  for (var i = 0; i < mults.length; i++) {
    if (mults[i] * mag >= raw) return mults[i] * mag;
  }
  return 10 * mag;
}

// Which scale tab is open. Kept across snapshots so clicking a second atom
// does not throw you back to pKBHX when you were reading pKa.
var hpScaleTab = "pKBHX";

function renderScales(scales) {
  if (!scales || !scales.length) return "";
  var i = 0;
  scales.forEach(function (sc, k) {
    if (sc.quantity === hpScaleTab) i = k;
  });
  var sc = scales[i];
  var tabs = "";
  if (scales.length > 1) {
    tabs = '<div class="tabs">' + scales.map(function (s2, k) {
      return '<button class="tab' + (k === i ? " on" : "")
        + '" onclick="hpPickScale(\'' + esc(s2.quantity) + '\')" title="'
        + esc(s2.means || "") + '">' + esc(s2.symbol || s2.quantity)
        + '</button>';
    }).join("") + '</div>';
  }
  var head = '<div class="tiny muted">' + esc(sc.title || "")
    + (sc.unit ? ' &middot; ' + esc(sc.unit) : "") + '</div>';
  return tabs + head + renderScale(sc);
}

function hpPickScale(q) {
  hpScaleTab = q;
  if (window.hpLast) renderHit(window.hpLast.hit, window.hpLast.scales,
                               window.hpLast.torsion);
}

function renderTorsion(tp) {
  if (!tp || !tp.curve || !tp.curve.length) return "";
  var W = 430, H = 150, L = 42, R = 12, T = 12, B = 30;
  var xs = tp.curve.map(function (p) { return p.angle; });
  var hiY = Math.max.apply(null, tp.curve.map(function (p) { return p.q3; }));
  hiY = Math.max(hiY, 1);
  var loX = Math.min.apply(null, xs), hiX = Math.max.apply(null, xs);
  function X(a) { return L + (a - loX) / ((hiX - loX) || 1) * (W - L - R); }
  function Y(e) { return T + (1 - e / hiY) * (H - T - B); }

  var p = ['<div class="scale"><svg viewBox="0 0 ' + W + " " + H
           + '" preserveAspectRatio="xMidYMin meet">'];

  // interquartile band: the spread matters as much as the median
  var up = tp.curve.map(function (c) { return X(c.angle) + "," + Y(c.q3); });
  var dn = tp.curve.slice().reverse().map(function (c) {
    return X(c.angle) + "," + Y(c.q1); });
  p.push('<polygon points="' + up.concat(dn).join(" ")
    + '" fill="var(--accent)" opacity="0.14"/>');

  // median curve
  p.push('<polyline fill="none" stroke="var(--accent)" stroke-width="1.8" '
    + 'points="' + tp.curve.map(function (c) {
        return X(c.angle) + "," + Y(c.median); }).join(" ") + '"/>');

  // axes
  p.push('<line x1="' + L + '" y1="' + Y(0) + '" x2="' + (W - R) + '" y2="'
    + Y(0) + '" stroke="var(--line)"/>');
  for (var a = loX; a <= hiX; a += 30) {
    p.push('<text class="ax" x="' + X(a) + '" y="' + (H - 14)
      + '" text-anchor="middle">' + a + "</text>");
  }
  [0, hiY / 2, hiY].forEach(function (e) {
    p.push('<text class="ax" x="' + (L - 5) + '" y="' + (Y(e) + 3)
      + '" text-anchor="end">' + e.toFixed(1) + "</text>");
  });
  p.push('<text class="ax" x="' + ((L + W - R) / 2) + '" y="' + (H - 2)
    + '" text-anchor="middle">' + esc(tp.x_label) + "</text>");

  // where this bond sits
  if (tp.marker) {
    var mx = X(tp.marker.angle);
    p.push('<line x1="' + mx + '" y1="' + T + '" x2="' + mx + '" y2="' + Y(0)
      + '" stroke="var(--salt)" stroke-width="1.5" stroke-dasharray="3 2"/>');
    if (tp.marker.energy !== null && tp.marker.energy !== undefined) {
      p.push('<circle cx="' + mx + '" cy="' + Y(tp.marker.energy)
        + '" r="3" fill="var(--salt)"/>');
    }
  }
  p.push("</svg></div>");

  var note = esc(tp.label) + " &middot; " + tp.n_scans + " QM scans";
  if (tp.marker) {
    note += " &middot; measured " + tp.marker.measured + "&deg;";
    if (tp.marker.energy !== null && tp.marker.energy !== undefined) {
      note += ", costing <b>" + tp.marker.energy + " kcal/mol</b>";
    }
  }
  if (!tp.exact) note += ' &middot; <span class="flag">indicative only</span>';
  p.push('<div class="scale-note">' + note
    + " &middot; band is the interquartile range &middot; gas-phase QM, an "
    + "intrinsic cost rather than a verdict</div>");
  return p.join("");
}

function renderHit(hit, scales, torsion) {
  var el = document.getElementById("hit");
  if (!hit) {
    el.innerHTML = '<p class="empty">Click an atom in the 3D view.</p>';
    return;
  }
  var h = '<div class="card"><b>' + esc(hit.title) + '</b></div>';

  (hit.warnings || []).forEach(function (w) {
    h += '<div class="card warn tiny">' + esc(w) + '</div>';
  });

  (hit.annotations || []).forEach(function (a) {
    // A pKBH+ that says "neutral at pH 7.4" tells you nothing pKBHX did
    // not. It is here for the case where it overrides pKBHX entirely.
    if (a.changes_the_answer === false) return;
    // Lead with the parent compound's own cited value where there is one.
    // A family median is the fallback, not the headline: the azine family
    // runs 0.3 to 2.0 while pyrazine itself is 0.92.
    var rep = a.representative;
    // A median of 9.864 over 20 compounds is false precision; 2 dp
    // is the most any of these sources justifies.
    var n2 = function (v) {
      return (typeof v === "number") ? +v.toFixed(2) : v;
    };
    var lead = (rep && typeof rep.value === "number")
      ? '<span class="val"><b>' + n2(rep.value) + "</b></span>"
      : '<span class="val">median <b>' + n2(a.median) + "</b></span>";
    h += '<div class="card"><div class="row spread">'
      + '<b>' + esc(a.quantity) + '</b>' + lead + '</div>';
    if (a.means) {
      h += '<div class="tiny muted">' + esc(a.means) + '</div>';
    }
    if (rep && typeof rep.value === "number") {
      h += '<div class="tiny muted val">' + esc(rep.compound || "parent")
        + (a.n > 1 ? " &middot; family " + n2(a.min) + " to " + n2(a.max)
                     + " over " + a.n + " compounds" : "")
        + (a.n_flagged ? ' &middot; <span class="flag">' + a.n_flagged
           + ' flagged for review</span>' : "") + '</div>';
    } else {
      h += '<div class="tiny muted val">range ' + n2(a.min) + " to " + n2(a.max)
        + " over " + a.n + " compounds"
        + (a.n_flagged ? ' &middot; <span class="flag">' + a.n_flagged
           + ' flagged for review</span>' : "") + '</div>';
    }
    if (a.verdict) {
      h += '<div class="tiny' + (a.verdict.level === "cation"
          ? ' flag' : " muted") + '"><b>' + a.verdict.percent_protonated
        + '%</b> protonated &mdash; ' + esc(a.verdict.text) + '</div>';
    }
    h += '<div class="tiny muted">' + esc(a.entry_title) + '</div></div>';
  });

  var sv = (window.hpShowScale === false) ? "" : renderScales(scales);
  if (sv) {
    h += '<h2 style="border:none;padding-top:4px">Where this sits</h2>' + sv;
  }
  var tv = (window.hpShowScale === false) ? "" : renderTorsion(torsion);
  if (tv) {
    h += '<h2 style="border:none;padding-top:4px">Torsion profile</h2>' + tv;
  }

  (hit.entries || []).slice(0, 6).forEach(function (e) {
    h += '<div class="entry"><h3>' + esc(e.title || e.id) + '</h3>';
    if (e.summary) {
      h += '<p class="tiny">' + esc(e.summary) + '</p>';
    }
    (e.practical_notes || []).forEach(function (n) {
      h += '<p class="tiny muted">&bull; ' + esc(n) + '</p>';
    });
    var g = e.geometry || {};
    if (g.d_ideal) {
      h += '<p class="tiny val muted">ideal ' + g.d_ideal + '&nbsp;&Aring;'
        + (g.d_min ? " (" + g.d_min + "&ndash;" + g.d_max + ")" : "") + '</p>';
    }
    if (g.directionality) {
      h += '<p class="tiny muted">' + esc(g.directionality) + '</p>';
    }
    var refs = {};
    (e.values || []).forEach(function (v) {
      if (v.ref && v.ref.doi) refs[v.ref.doi] = 1;
    });
    if (g.ref && g.ref.doi) refs[g.ref.doi] = 1;
    var keys = Object.keys(refs);
    if (keys.length) {
      h += '<p class="ref">' + keys.map(function (d) {
        return '<a href="https://doi.org/' + esc(d) + '" target="_blank">'
          + esc(d) + '</a>'; }).join(" &middot; ") + '</p>';
    }
    h += '</div>';
  });
  el.innerHTML = h;
}

hpRestoreFolds();
hp("ready");
</script>
</body>
</html>
