    along lone pairs; thioether S prefers the aryl ring plane (CH...S) not the π face; behaves like weakly negatively polarized atom similar to
    Cl. Met–aryl contacts: 9% edge, 8% face of 1276 Met (Pal & Chakrabarti, cited); CH...S ~40% of Met S interactions, S...π ~22% (Imai et al.,
    cited). Coplanar C–S–C above purines at ~4.0 Å (vdW).'
  curation_status: needs_review
