[build-system]
requires = ["ChimeraX-BundleBuilder>=1.3.0"]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "ChimeraX-Syto"
version = "0.1.1"
license = { text = "MIT" }
authors = [{ name = "Andrii Kyrylchuk" }]
description = "Hit-picking helper: scored non-covalent interactions and a contextual molecular-interaction handbook, alongside ViewDock"
dependencies = ["ChimeraX-Core>=1.9"]
dynamic = ["classifiers", "requires-python"]

[project.readme]
content-type = "text/markdown"
text = """
Analyses one docked pose at a time: detects and scores hydrogen bonds, salt
bridges, pi-stacking, cation-pi and halogen bonds against published geometric
criteria, and shows a citation-backed handbook entry for whatever you click.

The chemistry engine is the shared `hitpicking` package, used unchanged by the
web front end, so both give identical answers.
"""

[chimerax]
categories = ["Binding Analysis"]
classifiers = []
min-session-version = 1
max-session-version = 1
# custom-init is deliberately OFF. A bundle that runs code at startup
# and touches session.ui can construct the mouse-mode manager before
# ChimeraX does, which makes ObjectIdMouseMode register the
# 'mouse hover' trigger twice and breaks the Toolbar for everyone.
custom-init = false

[chimerax.package-data]
"src/ui" = ["*.html", "*.css", "*.js"]
"src/docs/user/tools" = ["*.html"]
"src/docs/user/commands" = ["*.html"]
"src/_vendor" = ["README.txt"]
"src/_vendor/hitpicking" = ["*.py", "data/*.json"]
"src/_vendor/hitpicking/io" = ["*.py"]
"src/_vendor/hitpicking/perceive" = ["*.py"]
"src/_vendor/hitpicking/nci" = ["*.py"]
"src/_vendor/hitpicking/handbook" = ["*.py"]

[chimerax.tool."Hit Picking Handbook"]
category = "Binding Analysis"
description = "Contextual handbook and interaction panel for hit picking"

[chimerax.tool."Hit Picking Learn"]
category = "Binding Analysis"
description = "Active learning over the grades given at a hit-picking party"

[chimerax.command."hitpick setup"]
category = "Binding Analysis"
description = "Prepare a binding site for hit picking"

[chimerax.command."hitpick analyze"]
category = "Binding Analysis"
description = "Analyse a docked pose and draw its interactions"

[chimerax.command."hitpick analyse"]
category = "Binding Analysis"
description = "Analyse a docked pose and draw its interactions"

[chimerax.command."hitpick show"]
category = "Binding Analysis"
description = "Enable interaction types"

[chimerax.command."hitpick hide"]
category = "Binding Analysis"
description = "Disable interaction types"

[chimerax.command."hitpick lengths"]
category = "Binding Analysis"
description = "Show or hide interaction lengths"

[chimerax.command."hitpick angles"]
category = "Binding Analysis"
description = "Show or hide interaction angles"

[chimerax.command."hitpick labels"]
category = "Binding Analysis"
description = "Label atoms with handbook values such as pKBHX"

[chimerax.command."hitpick explain"]
category = "Binding Analysis"
description = "Show the handbook entry for an atom"

[chimerax.command."hitpick report"]
category = "Binding Analysis"
description = "Text report of the current pose"

[chimerax.command."hitpick autoexplain"]
category = "Binding Analysis"
description = "Explain an atom automatically when it is selected"

[chimerax.command."hitpick scale"]
category = "Binding Analysis"
description = "Show where the clicked atom sits on the basicity scale"

[chimerax.command."hitpick clashes"]
category = "Binding Analysis"
description = "Show or hide van der Waals clashes"

[chimerax.command."hitpick limits"]
category = "Binding Analysis"
description = "Show the literature limits alongside each measured value"

[chimerax.command."hitpick scaleplot"]
category = "Binding Analysis"
description = "Show or hide the basicity scale plot in the panel"

[chimerax.command."hitpick torsions"]
category = "Binding Analysis"
description = "List rotatable torsions and flag the strained ones"

[chimerax.command."hitpick hover"]
category = "Binding Analysis"
description = "Show hitpick detail in the hover balloon"

[chimerax.command."hitpick panel"]
category = "Binding Analysis"
description = "Detach or re-dock the handbook panel"

[chimerax.command."hitpick width"]
category = "Binding Analysis"
description = "Set the thickness of interaction and clash lines"

[chimerax.command."hitpick torsionprofile"]
category = "Binding Analysis"
description = "Plot the QM energy profile for this pose's torsions"

[chimerax.command."hitpick stranded"]
category = "Binding Analysis"
description = "Highlight stranded H-bond donors and/or acceptors"

[chimerax.command."hitpick reveal"]
category = "Binding Analysis"
description = "Display the residues the interactions point at"

[chimerax.command."hitpick learn panel"]
category = "Binding Analysis"
description = "Open the active-learning panel"

[chimerax.command."hitpick learn collect"]
category = "Binding Analysis"
description = "Analyse and featurise poses for active learning"

[chimerax.command."hitpick learn grade"]
category = "Binding Analysis"
description = "Grade a pose good, maybe or bad"

[chimerax.command."hitpick learn train"]
category = "Binding Analysis"
description = "Train the model on the grades given so far"

[chimerax.command."hitpick learn next"]
category = "Binding Analysis"
description = "List the poses worth grading next"

[chimerax.command."hitpick learn worklist"]
category = "Binding Analysis"
description = "Work the suggestion list down inside ViewDock"

[chimerax.command."hitpick learn terms"]
category = "Binding Analysis"
description = "Choose which docking score terms the model learns from"

[chimerax.command."hitpick learn assume"]
category = "Binding Analysis"
description = "Treat unrated poses as a grade, for a fully walked list"

[chimerax.command."hitpick learn status"]
category = "Binding Analysis"
description = "Report the state of the active-learning model"

[chimerax.command."hitpick learn save"]
category = "Binding Analysis"
description = "Save the model and grades"

[chimerax.command."hitpick learn load"]
category = "Binding Analysis"
description = "Load a saved model and grades"

[chimerax.command."hitpick learn cancel"]
category = "Binding Analysis"
description = "Stop background analysis or training"

[chimerax.command."hitpick learn apply"]
category = "Binding Analysis"
description = "Write the model's predictions into the ViewDock table"

[chimerax.command."hitpick clear"]
category = "Binding Analysis"
description = "Remove hitpick drawings"
