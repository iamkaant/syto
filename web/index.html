<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hit Picking</title>
<link rel="stylesheet" href="vendor/molstar/molstar.css">
<style>
  :root {
    --bg:#15181d; --card:#1b1f26; --line:#2a2f39; --fg:#e6e9ef;
    --muted:#8b93a3; --accent:#4b9fff; --warn:#c98a00; --bad:#e64646;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
         font:13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* The side columns are draggable. Their widths live in these variables
     so a pointermove writes one property and the browser does the
     layout, instead of script measuring and assigning. */
  :root { --left:290px; --right:360px; }
  #shell { display:grid; height:100vh;
           grid-template-columns:var(--left) 6px minmax(260px,1fr) 6px var(--right);
           grid-template-rows:38px minmax(0,1fr); }
  .gutter { cursor:col-resize; background:var(--line); position:relative; }
  /* A 6px bar is hard to hit; the hit area is wider than the line. */
  .gutter::after { content:""; position:absolute; top:0; bottom:0;
                   left:-4px; right:-4px; }
  .gutter:hover, .gutter.dragging { background:var(--accent); }
  @media (max-width:1100px) {
    body { overflow:auto; }
    #shell { grid-template-columns:1fr; grid-template-rows:auto; height:auto; }
    #stage { height:62vh; }
    #panel { height:70vh; }
    .gutter { display:none; }
  }
  header { grid-column:1/-1; display:flex; align-items:center; gap:12px;
           padding:0 12px; border-bottom:1px solid var(--line);
           background:var(--card); }
  header b { font-size:12px; letter-spacing:.05em; text-transform:uppercase;
             color:var(--muted); font-weight:600; }
  #status { font-size:11.5px; color:var(--muted); flex:1;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status.warn { color:var(--warn); }
  /* Permanent, because the status line is transient: it is overwritten
     by the first pose you analyse, and it is clipped with an ellipsis
     long before its end. The build was only ever written there, so
     "which build am I looking at" was unanswerable exactly when it
     mattered - with a stale page on screen. */
  #build { font-size:11px; color:var(--muted); white-space:nowrap;
           flex:none; font-variant-numeric:tabular-nums; cursor:default; }
  aside { overflow-y:auto; border-right:1px solid var(--line); padding:10px; }
  /* Mol* takes the element it is given and replaces its contents, so
     nothing of ours may live inside #view. The drop notice and the
     colour key sit in #stage, over it. They used to be children of
     #view, which is why a second Analyse threw on a $("drop") that was
     no longer in the document. */
  #stage { position:relative; min-height:300px; }
  #view { position:absolute; inset:0; background:#0d1014; }
  #panel { border-left:1px solid var(--line); border-right:none; padding:0; }
  #panel iframe { width:100%; height:100%; border:0; display:block; }
  h2 { font-size:11px; letter-spacing:.05em; text-transform:uppercase;
       color:var(--muted); margin:14px 0 6px; font-weight:600; }
  h2:first-child { margin-top:0; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:7px; padding:8px 10px; margin-bottom:7px; }
  .tiny { font-size:11.5px; } .muted { color:var(--muted); }
  .warn { border-color:var(--warn); }
  .row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  button { font:inherit; padding:5px 11px; border-radius:6px;
           border:1px solid var(--line); background:var(--card);
           color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent);
                   color:#06121f; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=file] { font-size:11px; max-width:100%; }
  select { font:inherit; background:var(--card); color:var(--fg); width:100%;
           border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  label.chk { display:flex; align-items:center; gap:7px; cursor:pointer;
              padding:2px 0; font-size:12px; }
  .swatch { width:10px; height:10px; border-radius:2px; flex:none; }
  code { background:#11141a; padding:1px 4px; border-radius:4px; }
  .irow { padding:4px 0; border-top:1px solid var(--line); }
  .irow:first-child { border-top:0; }
  .q { height:4px; border-radius:2px; background:var(--accent); }
  .grades { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grades button { padding:7px 4px; font-weight:600; }
  .grades button i { font-style:normal; opacity:.55; font-weight:400; }
  .g-bad { color:#e88; border-color:#5a3030; }
  .g-maybe { color:#e3c07a; border-color:#5a4d30; }
  .g-good { color:#8ad6a0; border-color:#2f5a3e; }
  .grades button.on { outline:2px solid currentColor; outline-offset:-2px; }
  .bar { height:4px; border-radius:2px; background:var(--line);
         margin-top:7px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; }
  .srow { display:flex; justify-content:space-between; gap:6px;
          padding:3px 4px; border-radius:4px; cursor:pointer;
          font-size:11.5px; }
  .srow:hover { background:var(--line); }
  .srow.on { outline:1px solid var(--accent); }
  .srow .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .counts span { margin-right:9px; }
  /* The legend belongs where you are looking. The swatches beside the
     type toggles are in a panel you have to look away to read, which is
     exactly what a legend is for avoiding. */
  #legend { position:absolute; left:10px; bottom:10px; z-index:3;
            display:flex; flex-direction:column; gap:3px; font-size:11px;
            padding:6px 9px; border-radius:7px; pointer-events:none;
            background:rgba(10,13,18,.74); border:1px solid var(--line);
            backdrop-filter:blur(3px); max-width:46%; }
  #legend .lrow { display:flex; align-items:center; gap:6px;
                  white-space:nowrap; }
  #legend[hidden] { display:none; }
  #drop { position:absolute; inset:0; display:flex; align-items:center;
          justify-content:center; text-align:center; color:var(--muted);
          font-size:13px; padding:30px; pointer-events:none; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <b>Hit Picking</b>
    <span id="status">starting&hellip;</span>
    <span id="build" title="which build is on screen">&nbsp;</span>
  </header>

  <aside>
    <h2>Load</h2>
    <div class="card">
      <div class="tiny muted">receptor &mdash; PDB, with hydrogens</div>
      <input type="file" id="rec" accept=".pdb,.ent">
      <div class="tiny muted" style="margin-top:6px">poses &mdash; mol2 or SDF</div>
      <input type="file" id="lig" accept=".mol2,.sdf,.sd,.mol">
      <div class="row" style="margin-top:8px">
        <button class="primary" id="go" disabled>Analyse</button>
      </div>
      <div id="loadmsg" class="tiny muted" style="margin-top:6px"></div>
    </div>

    <div id="posebox" style="display:none">
      <h2>Pose</h2>
      <select id="pose"></select>
      <div class="row tiny" style="margin-top:6px;justify-content:space-between">
        <button id="prev">&larr;</button>
        <span id="posen" class="muted"></span>
        <button id="next">&rarr;</button>
      </div>
      <div id="pose-out" style="margin-top:7px"></div>
    </div>

    <h2>Shown</h2>
    <div class="card" id="toggles"></div>
    <div class="card">
      <label class="chk"><input type="checkbox" id="opt-labels" checked>
        Labels on the lines</label>
      <label class="chk"><input type="checkbox" id="opt-legend" checked>
        Colour key in the view</label>
      <div class="row" style="margin-top:6px">
        <button id="reset" title="back to the pocket, and drop any picked torsion">Reset view</button>
      </div>
      <label class="chk"><input type="checkbox" id="opt-clashes" checked>
        <span class="swatch" style="background:#e64646"></span>
        Clashes</label>
      <label class="chk"><input type="checkbox" id="opt-site" checked>
        Pocket residues as sticks</label>
      <label class="chk"><input type="checkbox" id="opt-reslabels">
        Name the pocket residues</label>
      <label class="chk"><input type="checkbox" id="opt-sitekeep">
        Keep every pocket residue shown</label>
      <label class="chk"><input type="checkbox" id="opt-ribbon">
        Protein ribbon</label>
      <label class="chk" style="gap:9px">
        <input type="range" id="opt-stick" min="0.04" max="0.3" step="0.01"
               value="0.1" style="flex:1">
        <span style="white-space:nowrap">sticks <b id="stickval">0.10</b></span>
      </label>
      <label class="chk" style="gap:9px">
        <!-- 1x is the ceiling: past it the lines are thicker than the
             bonds they are drawn between and the pose disappears behind
             its own annotation. -->
        <input type="range" id="opt-linew" min="0.3" max="1" step="0.05"
               value="1" style="flex:1">
        <span style="white-space:nowrap">lines <b id="linewval">1.0</b>&times;</span>
      </label>
      <label class="chk" style="gap:9px">
        <input type="range" id="opt-text" min="0.15" max="1.2" step="0.05"
               value="0.33" style="flex:1">
        <span style="white-space:nowrap">labels <b id="textval">0.33</b></span>
      </label>
    </div>

    <h2>Grade</h2>
    <div class="card">
      <div class="grades">
        <button class="g-bad" id="g-bad">bad <i>b</i></button>
        <button class="g-maybe" id="g-maybe">maybe <i>m</i></button>
        <button class="g-good" id="g-good">good <i>g</i></button>
      </div>
      <label class="chk tiny" style="margin-top:6px">
        <input type="checkbox" id="opt-advance" checked>
        Move to the next suggestion after grading</label>
      <div id="gradestate" class="tiny muted" style="margin-top:6px"></div>
    </div>

    <h2>Model</h2>
    <div class="card">
      <div class="row">
        <button id="featurise">Analyse all poses</button>
        <button class="primary" id="train" disabled>Train</button>
      </div>
      <div class="bar" id="featbar" style="display:none"><i></i></div>
      <div id="modelstate" class="tiny muted" style="margin-top:6px"></div>
      <div class="row" style="margin-top:7px">
        <button id="save" class="tiny">Save party</button>
        <button id="csv" class="tiny">Results CSV</button>
        <button id="load" class="tiny">Load&hellip;</button>
        <input type="file" id="loadfile" accept=".json" style="display:none">
      </div>
    </div>

    <div id="suggestbox" style="display:none">
      <h2>Look at these next</h2>
      <div class="card" style="padding:6px 8px">
        <select id="strategy">
          <option value="uncertainty">what teaches the model most</option>
          <option value="disagreement">where it disagrees with you</option>
          <option value="prediction">best predicted</option>
        </select>
        <div id="suggestions" style="margin-top:6px"></div>
      </div>
    </div>

  </aside>

  <div class="gutter" id="gut-l" title="drag to resize"></div>

  <div id="stage">
    <div id="view"></div>
    <div id="drop">Load a receptor and a pose file.<br>
      Everything is computed in this tab; no file leaves your machine.</div>
    <div id="legend" hidden></div>
  </div>

  <div class="gutter" id="gut-r" title="drag to resize"></div>

  <div id="panel"><iframe id="hb" title="handbook"></iframe></div>
</div>

<script src="vendor/molstar/molstar.js"></script>
<script src="js/viewer.js"></script>
<script src="ui/bridge.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Constructed lazily, and only after the file:// check.
//
// `new Worker()` THROWS from a file:// origin rather than failing later,
// which killed this whole script at its first line - so the page sat on
// "starting..." with no handlers attached and no message, which is
// exactly what it looked like when someone opened it from disk.
let bridge = null;
const files = {rec: null, lig: null};
let viewer = null, poses = [], current = 0, lastResult = null;
// The flagged torsions of the current pose, which row is picked, and
// that bond's QM profile. The panel renders all three; this page is
// only keeping them so a re-send of the snapshot does not lose them.
let torsionRows = [], torsionWarn = null, torsionPick = null,
    torsionProfile = null;
// The last scene drawn, so the legend can be rebuilt without asking
// the engine for it again.
let lastScene = null;
let enabled = null;   // null = whatever the core defaults to

const TYPES = [
  ["hbond", "hydrogen bond"], ["hbond_charged", "charged H-bond"],
  ["salt_bridge", "salt bridge"], ["pi_stack_parallel", "π stack"],
  ["pi_stack_tshaped", "π stack, T"], ["cation_pi", "cation–π"],
  ["halogen_bond", "halogen bond"], ["hydrophobic", "hydrophobic"],
  ["hbond_weak", "weak H-bond"]
];

function say(text, bad) {
  $("status").className = bad ? "warn" : "";
  $("status").innerHTML = text;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function hex(n) { return "#" + n.toString(16).padStart(6, "0"); }

// ------------------------------------------------------------ the panel
// The handbook panel is the SAME file the ChimeraX bundle loads. It is
// written against window.hpHost rather than against either host, so an
// atom is explained by one renderer in both places - which is the only
// way the two can be relied on to say the same thing.
function panelWindow() {
  const f = $("hb");
  return f && f.contentWindow;
}
function sendPanel(snap) {
  const w = panelWindow();
  if (w && w.hpSetState) w.hpSetState(snap);
}
$("hb").onload = () => {
  const w = panelWindow();
  w.hpBridge = {call: (action, params) => onPanelAction(action, params)};
  sendPanel(baseSnapshot());
};

function baseSnapshot(hit, scales) {
  return {
    ready: !!lastResult,
    handbook: window.__handbook || null,
    viewdock: false,
    options: {
      enabled_nci: enabled || [],
      show_lengths: true, show_angles: false, show_limits: false,
      show_clashes: $("opt-clashes").checked, show_scale: true,
      hover_detail: false, line_width: 0.075,
      handbook_on_click: true, reveal_partners: false
    },
    // The panel draws a swatch per row. The colours come from the
    // viewer rather than being written out again here, so the list and
    // the picture cannot disagree.
    colors: Object.fromEntries(TYPES.map((t) =>
      [t[0], hex(HPViewer.COLORS[t[0]] || 0x8b93a3)])),
    pose: lastResult ? {
      name: lastResult.name, counts: lastResult.counts,
      warnings: lastResult.warnings, interactions: lastResult.interactions,
      strain: lastResult.strain ? lastResult.strain.counts : null,
      worst_overlap: lastResult.strain ? lastResult.strain.worst_overlap : null
    } : null,
    hit: hit || null,
    scales: scales || [],
    torsions: torsionRows.map((r) => ({...r, selected: r.bond === torsionPick})),
    torsion_warn_kcal: torsionWarn,
    torsion: torsionProfile,
    // An explicit pick opens the torsion section even when it was left
    // closed: a profile nobody can see is not an answer.
    torsion_picked: torsionPick !== null
  };
}

async function onPanelAction(action, params) {
  // The panel's own controls, mapped onto this host. Anything ChimeraX-only
  // simply has no effect here rather than erroring.
  if (action === "toggle") {
    const set = new Set(enabled || TYPES.map((t) => t[0]).slice(0, 8));
    if (params.on === 1 || params.on === "1") set.add(params.kind);
    else set.delete(params.kind);
    enabled = [...set];
    syncToggles();
    await analyse(current);
  } else if (action === "clashes") {
    $("opt-clashes").checked = params.on === 1 || params.on === "1";
    await redraw();
  } else if (action === "analyze") {
    await analyse(current);
  } else if (action === "torsion") {
    await pickTorsion(params.bond);
  } else if (action === "highlight") {
    await focusInteraction(params.atoms);
  }
}

// The host and theme travel in the URL: the panel reads them as its own
// script runs, which a property set on the frame from out here could
// never be early enough for.
$("hb").src = "ui/panel.html?host=web&theme=dark";

// ------------------------------------------------------------- loading
async function readFile(input) {
  const f = input.files && input.files[0];
  if (!f) return null;
  return {name: f.name, text: await f.text()};
}
$("rec").onchange = async () => {
  files.rec = await readFile($("rec"));
  $("go").disabled = !(files.rec && files.lig);
};
$("lig").onchange = async () => {
  files.lig = await readFile($("lig"));
  $("go").disabled = !(files.rec && files.lig);
};

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    say("perceiving the receptor&hellip;");
    const r = await bridge.call("setup", files.rec);
    window.__handbook = r.handbook;
    // Start from what the core actually computes, not from "everything".
    // Ticking all nine boxes while the core ran seven meant the first
    // toggle - any toggle - sent those ticks back and switched on weak
    // H-bonds and hydrophobics for the first time. The tool looked like
    // it turned everything on when you turned one thing off.
    if (r.default_nci && r.default_nci.length) enabled = r.default_nci;
    say("reading poses&hellip;");
    siteUnion = new Map();
    lastSiteSig = null;
    const p = await bridge.call("loadPoses", {...files.lig, limit: 2000});
    poses = p.names;

    $("drop").style.display = "none";
    if (!viewer) {
      viewer = new HPViewer.Viewer("view");
      await viewer.start();
      viewer.onAtomClick = onAtomClick;
      viewer.onBondClick = onBondClick;
      viewer.onEmptyClick = () => clearTorsionPick(true);
      viewer.onOtherClick = (kind) =>
        say("that click landed on a " + esc(String(kind).replace("-loci", ""))
            + ", not an atom or a bond");
      viewer.siteSize = +$("opt-stick").value;
      viewer.siteLabels = $("opt-reslabels").checked;
      viewer.lineSize = +$("opt-linew").value;
      viewer.textSize = +$("opt-text").value;
    }
    say("drawing&hellip;");
    const nrec = await viewer.loadReceptor(files.rec.text, "pdb");
    const fmt = /\.mol2$/i.test(files.lig.name) ? "mol2" : "sdf";
    const nmod = await viewer.loadPoses(files.lig.text, fmt);

    $("loadmsg").innerHTML = esc(r.receptor) + ": " + r.n_atoms + " atoms"
      + (r.has_hydrogens ? "" : " &middot; <b>no hydrogens</b>")
      + "<br>" + p.count + " pose(s)"
      + (nmod !== p.count ? " (viewer sees " + nmod + ")" : "");

    const restored = restoreLocal();
    if (restored) {
      myGrades = restored;
      say("found grades for this file from a previous visit; they will be "
          + "applied as the poses are analysed");
    }
    renderPoseOptions();
    $("pose").onchange = () => analyse(+$("pose").value);
    $("posebox").style.display = "";
    renderToggles();
    viewer.setRibbon($("opt-ribbon").checked);
    await analyse(0);
    viewer.focusSite();
  } catch (e) {
    say("failed: " + esc(e.message), true);
  } finally {
    $("go").disabled = false;
  }
};

$("prev").onclick = () => analyse(Math.max(0, current - 1));
$("next").onclick = () => analyse(Math.min(poses.length - 1, current + 1));
$("g-bad").onclick = () => gradePose("bad");
$("g-maybe").onclick = () => gradePose("maybe");
$("g-good").onclick = () => gradePose("good");
$("featurise").onclick = featuriseAll;
$("strategy").onchange = refreshSuggestions;
$("save").onclick = savePartyFile;
$("csv").onclick = saveResultsCsv;
$("load").onclick = () => $("loadfile").click();
$("loadfile").onchange = async () => {
  if ($("loadfile").files[0]) await loadPartyFile($("loadfile").files[0]);
};
$("train").onclick = async () => {
  $("train").disabled = true;
  say("training&hellip;");
  try {
    const r = await bridge.call("train", {epochs: 100});
    if (!r.trained) { say(esc(r.why_not), true); }
    else {
      say("trained on " + r.trained_on + " graded pose(s) in "
          + r.seconds + " s");
    }
  } catch (e) {
    say("training failed: " + esc(e.message), true);
  }
  await refreshAl();
};

// b / m / g, the hotkeys ViewDock uses, so the two front ends are graded
// the same way. Ignored while typing in a field.
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  const k = {b: "bad", m: "maybe", g: "good"}[e.key];
  if (k) { e.preventDefault(); gradePose(k); }
  else if (e.key === "ArrowRight") { e.preventDefault(); $("next").click(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); $("prev").click(); }
});
$("opt-labels").onchange = () => { saveView(); redraw(); };
$("opt-legend").onchange = () => { saveView(); renderLegend(lastScene); };
$("reset").onclick = resetView;
$("opt-clashes").onchange = () => { saveView(); redraw(); };
$("opt-site").onchange = () => { saveView(); redraw(); };
$("opt-sitekeep").onchange = () => { saveView(); redraw(); };
$("opt-reslabels").onchange = () => {
  if (viewer) viewer.siteLabels = $("opt-reslabels").checked;
  saveView();
  redraw();
};
$("opt-ribbon").onchange = () => {
  if (viewer) viewer.setRibbon($("opt-ribbon").checked);
  saveView();
};
// Each slider: a live readout while it moves, and the viewer updated
// when it settles. The readout is refreshed on BOTH events, because only
// dragging fires `input` - arrow keys, a reset, and anything that sets
// the value from code fire `change` alone, and the number beside the
// slider would sit there contradicting it.
function wireSlider(id, readoutId, digits, apply) {
  const el = $(id), out = $(readoutId);
  const show = () => { out.textContent = (+el.value).toFixed(digits); };
  el.addEventListener("input", show);
  el.addEventListener("change", async () => {
    show();
    if (viewer) apply(+el.value);
    saveView();
    await redraw();
  });
}

wireSlider("opt-stick", "stickval", 2, (v) => { viewer.siteSize = v; });
wireSlider("opt-linew", "linewval", 1, (v) => { viewer.lineSize = v; });
wireSlider("opt-text", "textval", 2, (v) => { viewer.textSize = v; });

// Dragging a gutter.
//
// Pointer capture rather than listeners on the document: it keeps the
// drag alive over the iframe and over Mol*'s canvas, both of which would
// otherwise swallow the events the moment the cursor crossed them.
function wireGutter(id, side) {
  const el = $(id);
  if (!el) return;
  const prop = side === "left" ? "--left" : "--right";
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    el.classList.add("dragging");
    const startX = e.clientX;
    const start = columnWidth(prop);
    const move = (ev) => {
      const dx = ev.clientX - startX;
      const want = side === "left" ? start + dx : start - dx;
      const max = Math.max(200, window.innerWidth - 520);
      setColumn(prop, Math.min(max, Math.max(180, want)));
    };
    const up = () => {
      el.classList.remove("dragging");
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      saveView();
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
  });
  // Double-click puts it back where it started.
  el.addEventListener("dblclick", () => {
    setColumn(prop, side === "left" ? 290 : 360);
    saveView();
  });
}

function columnWidth(prop) {
  const v = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue(prop));
  return isNaN(v) ? (prop === "--left" ? 290 : 360) : v;
}

function setColumn(prop, px) {
  document.documentElement.style.setProperty(prop, px + "px");
  // Mol* sizes its canvas to the element; without this the 3D view keeps
  // the old width and letterboxes until something else forces a redraw.
  if (viewer && viewer.viewer) {
    try { viewer.viewer.handleResize(); } catch (e) { /* not up yet */ }
  }
}

wireGutter("gut-l", "left");
wireGutter("gut-r", "right");

// These are preferences, not state: they should survive a reload, which
// is what "the setting is not saved" meant.
function saveView() {
  try {
    localStorage.setItem("hitpicking.view", JSON.stringify({
      site: $("opt-site").checked, ribbon: $("opt-ribbon").checked,
      stick: +$("opt-stick").value, linew: +$("opt-linew").value,
      text: +$("opt-text").value,
      labels: $("opt-labels").checked, clashes: $("opt-clashes").checked,
      legend: $("opt-legend").checked,
      reslabels: $("opt-reslabels").checked,
      sitekeep: $("opt-sitekeep").checked,
      left: columnWidth("--left"), right: columnWidth("--right")
    }));
  } catch (e) { /* private window */ }
}
function restoreView() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem("hitpicking.view") || "null"); }
  catch (e) { d = null; }
  if (!d) d = {};
  if (d.site !== undefined) $("opt-site").checked = !!d.site;
  if (d.ribbon !== undefined) $("opt-ribbon").checked = !!d.ribbon;
  if (d.labels !== undefined) $("opt-labels").checked = !!d.labels;
  if (d.clashes !== undefined) $("opt-clashes").checked = !!d.clashes;
  if (d.legend !== undefined) $("opt-legend").checked = !!d.legend;
  if (d.reslabels !== undefined) $("opt-reslabels").checked = !!d.reslabels;
  if (d.sitekeep !== undefined) $("opt-sitekeep").checked = !!d.sitekeep;
  if (d.stick) $("opt-stick").value = d.stick;
  // A width saved when the slider went to 3x is outside the range now;
  // the input would clamp it silently and the readout would lie.
  if (d.linew) $("opt-linew").value = Math.min(+d.linew, 1);
  if (d.text) $("opt-text").value = d.text;
  $("stickval").textContent = (+$("opt-stick").value).toFixed(2);
  $("linewval").textContent = (+$("opt-linew").value).toFixed(1);
  $("textval").textContent = (+$("opt-text").value).toFixed(2);
  if (d.left) setColumn("--left", d.left);
  if (d.right) setColumn("--right", d.right);
}

// ------------------------------------------------------------ analysing
//
// Every analysis is numbered, and a continuation that finds a newer
// number stops. Holding down "next" starts an analysis per click, each
// several awaits long; without this they interleave and the last one to
// finish - not the last one asked for - is what you end up looking at,
// with the others' work drawn over it.
let analyseSeq = 0;

async function analyse(i) {
  const my = ++analyseSeq;
  current = i;
  $("pose").value = String(i);
  $("posen").textContent = (i + 1) + " of " + poses.length;
  say("analysing&hellip;");
  const res = await bridge.call("analyse",
    {index: i, enabled: enabled, strain: true});
  if (my !== analyseSeq) return;
  lastResult = res;
  await loadTorsions();
  if (my !== analyseSeq) return;
  await viewer.showPose(i);
  if (my !== analyseSeq) return;
  renderPose(res);
  await redraw();
  if (my !== analyseSeq) return;
  sendPanel(baseSnapshot());
  setGradeButtons(gradeOf(i));
  $("gradestate").innerHTML = gradeState(i);
  $("pose").value = String(i);
  document.querySelectorAll("#suggestions .srow").forEach((el) => {
    el.classList.toggle("on", +el.getAttribute("data-i") === i);
  });
  say(esc(res.name) + " &middot; " + esc(res.summary));
}

// The pocket, across poses.
//
// Which residues line the pocket is decided per pose, so stepping
// through a series re-picks them and the sticks come and go underneath
// you. Keeping them accumulates the union of every pose looked at, which
// is the pocket rather than this ligand's neighbourhood. It resets with
// a new file.
let siteUnion = new Map();
let lastSiteSig = null;

function siteCoords(scene) {
  const here = scene.site || [];
  if (!$("opt-sitekeep").checked) return here;
  here.forEach((c) => siteUnion.set(c.join(","), c));
  return [...siteUnion.values()];
}

async function redraw() {
  if (!viewer || !lastResult) return;
  // The engine holds one analysed pose. If a newer analysis landed while
  // this scene was being fetched, the scene is of a different ligand
  // than the one on screen - so drop it rather than draw it.
  const my = analyseSeq;
  const scene = await bridge.call("scene", {});
  if (my !== analyseSeq) return;
  if ($("opt-site").checked) {
    const coords = siteCoords(scene);
    // Rebuilding an identical pocket is what "re-showing them every
    // time" looks like: the sticks blink out and back on every redraw,
    // including redraws that had nothing to do with them. The signature
    // carries what the drawing depends on, sizes and labels included.
    const sig = [coords.length, viewer.siteLabels, viewer.siteSize,
                 viewer.textSize].join("|") + ";"
              + coords.map((c) => c.join(",")).join(";");
    if (sig !== lastSiteSig || !viewer.site) {
      await viewer.showSite(coords);
      lastSiteSig = sig;
    }
  } else {
    await viewer.clearSite();
    lastSiteSig = null;
  }
  const n = await viewer.drawScene(scene, {
    labels: $("opt-labels").checked,
    clashes: $("opt-clashes").checked
  });
  lastScene = scene;
  renderLegend(scene);
  if (viewer.lastMissed) {
    say("drew " + n + " line(s); " + viewer.lastMissed
        + " could not be placed in the viewer", true);
  }
}

// The strained torsions of this pose, for the panel's list. Wrapped
// because a stale cached worker will not have the method, and a pose
// that still analyses and draws is worth more than one that throws over
// a list.
async function loadTorsions() {
  torsionRows = []; torsionWarn = null;
  torsionPick = null; torsionProfile = null;
  if (viewer) await viewer.clearTorsion();
  renderLegend(lastScene);
  try {
    const t = await bridge.call("torsions", {});
    torsionRows = t.rows || [];
    torsionWarn = t.warn_kcal;
    // The worst one by default, exactly as the ChimeraX panel does, so
    // the profile is there before anything has been clicked.
    if (torsionRows.length) {
      torsionProfile = await bridge.call("torsionProfile", {});
    }
  } catch (e) {
    say("torsions unavailable: " + esc(e.message), true);
  }
}

// A row click: select the bond in 3D and plot its profile, in the
// section the row is in. It used to also open the handbook on one of
// the bond's atoms - needed back when the profile was drawn under the
// handbook entry, and nothing but noise now that it is not: the entry
// brought its own basicity plot with it, which is the plot that kept
// appearing at the bottom of the panel. A row is a torsion question;
// the handbook answers atom clicks.
async function pickTorsion(bond) {
  const row = torsionRows.find((r) => r.bond === bond);
  if (!row || !lastResult) return;
  // The same row again is "put it back", not "pick it harder".
  if (torsionPick === bond) { await clearTorsionPick(); return; }
  torsionPick = bond;
  try {
    torsionProfile = await bridge.call("torsionProfile", {bond: bond});
  } catch (e) { torsionProfile = null; }
  if (viewer) await viewer.showTorsion(row.xyz || [row.a, row.b], true);
  renderLegend(lastScene);
  sendPanel(baseSnapshot());
  say(esc(row.kind) + " &middot; " + esc(row.label) + " &middot; "
      + row.angle.toFixed(0) + "&deg;"
      + (row.energy === null || row.energy === undefined
         ? "" : ", costing " + row.energy.toFixed(1) + " kcal/mol"));
}

// A pick has to be undoable. Highlighting a torsion moves the camera to
// it and leaves a component on screen; before this the only way back was
// to step to the next pose and return, which is not a way back.
async function clearTorsionPick(quiet) {
  const had = torsionPick !== null || (viewer && viewer.torsion);
  torsionPick = null;
  if (viewer) await viewer.clearTorsion();
  try {
    torsionProfile = torsionRows.length
      ? await bridge.call("torsionProfile", {}) : null;
  } catch (e) { torsionProfile = null; }
  renderLegend(lastScene);
  sendPanel(baseSnapshot());
  if (had && !quiet) say("selection cleared");
  return had;
}

// Back to the pocket, at any time. The camera is the one piece of state
// a user cannot put back by hand once something has flown it somewhere.
async function resetView() {
  await clearTorsionPick(true);
  if (viewer) viewer.focusSite();
  say("view reset to the binding site");
}

// A row in the pose list points at a line in the view. Clicking it
// takes you there - both ends of the interaction framed, so the line
// between them is what you are looking at, and highlighted so you can
// tell which of several it was. The row carries atom indices, which the
// page has no use for: it asks the engine where they are, because its
// viewer numbers atoms its own way.
async function focusInteraction(atoms) {
  if (!viewer || !lastResult) return;
  const idx = String(atoms || "").split(",")
    .map((x) => parseInt(x, 10)).filter((x) => !isNaN(x));
  if (!idx.length) return;
  try {
    const xyz = await bridge.call("atomsXyz", {atoms: idx});
    const n = viewer.focusAtoms(xyz);
    if (!n) say("those atoms are not in the viewer", true);
  } catch (e) {
    say("could not focus that interaction: " + esc(e.message), true);
  }
}

// Clicking the stick between two atoms asks about the torsion on that
// bond, which is a different question from clicking either end. Every
// rotatable bond the core measured answers, not only the flagged ones:
// "this one is fine" is worth knowing about a bond you are looking at,
// and it is the same measurement either way. Ring, double and terminal
// bonds have no torsion to measure and say so.
async function onBondClick(a, b) {
  if (!lastResult) return;
  try {
    const t = await bridge.call("torsionAt", {a: a, b: b});
    if (t.error) { say(esc(t.error)); return; }
    torsionPick = t.bond;
    torsionProfile = t.profile || null;
    if (viewer) await viewer.showTorsion(t.xyz || [a, b], false);
    renderLegend(lastScene);
    sendPanel(baseSnapshot());
    let msg = esc(t.kind) + " &middot; " + esc(t.label) + " &middot; "
            + t.angle.toFixed(0) + "&deg;";
    if (t.energy !== null && t.energy !== undefined) {
      msg += ", costing " + t.energy.toFixed(1) + " kcal/mol";
    } else if (!torsionProfile) {
      msg += " &middot; no QM reference for this bond class";
    }
    say(msg, !!t.flagged);
  } catch (e) {
    say("could not measure that bond: " + esc(e.message), true);
  }
}

async function onAtomClick(xyz, name) {
  try {
    const hit = await bridge.call("explainAt",
      {x: xyz[0], y: xyz[1], z: xyz[2]});
    if (hit.error) { say(esc(hit.error), true); return; }
    sendPanel(baseSnapshot(hit, hit.scales || []));
  } catch (e) {
    say("explain failed: " + esc(e.message), true);
  }
}

// ------------------------------------------------------ active learning
//
// The same loop the ChimeraX bundle runs: analyse the poses, grade a
// handful, train, and be handed the ones worth looking at next. The model
// is hitpicking.al in the zip - the same committee, the same acquisition,
// the same features - so a party started here can be finished there.

let alState = {poses: 0, graded: 0, trained: false};
let suggestions = [], featurising = false;
const GRADES = ["bad", "maybe", "good"];

function setGradeButtons(current) {
  GRADES.forEach((g) => {
    const b = $("g-" + g);
    b.classList.toggle("on", current === g);
    b.disabled = !canGradeNow();
  });
}
// Grading needs a pose loaded, and nothing else. A grade is a person's
// opinion; the model is optional and comes later, if at all.
function canGradeNow() {
  return poses.length > 0;
}

// A disabled button with no explanation is the worst of both worlds: it
// looks broken and it teaches nothing. Grading needs the pose featurised,
// so when it is not, say so and point at the button that fixes it.
function gradeState(i) {
  if (!canGradeNow()) return "load a receptor and some poses first";
  if (gradeOf(i)) return "you graded this <b>" + esc(gradeOf(i)) + "</b>";
  if (predicted[i]) {
    return "the model predicts <b>" + esc(predicted[i].grade) + "</b> ("
         + predicted[i].score.toFixed(2) + ")";
  }
  return "not graded &middot; <b>b</b> / <b>m</b> / <b>g</b>";
}

// Chunked, so a few thousand poses show progress instead of a dead tab.
// Each chunk is one worker call; between them the page repaints and a
// grade or a pose change still gets through.
async function featuriseAll() {
  if (featurising) { featurising = false; return; }
  featurising = true;
  $("featurise").textContent = "Stop";
  $("featbar").style.display = "";
  const total = poses.length;
  const t0 = performance.now();
  let at = alState.poses || 0;
  try {
    while (featurising && at < total) {
      const r = await bridge.call("featurise",
        {start: at, count: Math.min(16, total - at)});
      at = r.next;
      alState.poses = r.total_known;
      const pct = Math.round(100 * at / total);
      $("featbar").firstElementChild.style.width = pct + "%";
      const rate = (performance.now() - t0) / 1000 / Math.max(1, at);
      $("modelstate").innerHTML = at + " of " + total + " analysed &middot; "
        + Math.round(rate * 1000) + " ms each &middot; about "
        + Math.max(1, Math.round(rate * (total - at))) + " s left";
      await new Promise((r2) => setTimeout(r2, 0));
    }
  } catch (e) {
    say("analysing failed: " + esc(e.message), true);
  }
  featurising = false;
  $("featurise").textContent = "Analyse all poses";
  $("featbar").style.display = "none";
  await refreshAl();
}

async function refreshAl() {
  try { alState = await bridge.call("alStatus", {}); }
  catch (e) { return; }
  const g = alState.grades || {};
  const n = alState.graded || 0;
  $("modelstate").innerHTML =
    n + " graded"
    + (alState.poses ? " &middot; " + alState.poses + " analysed" : "")
    + (n ? "<br><span class='counts'>"
        + "<span style='color:#e88'>bad " + (g.bad || 0) + "</span>"
        + "<span style='color:#e3c07a'>maybe " + (g.maybe || 0) + "</span>"
        + "<span style='color:#8ad6a0'>good " + (g.good || 0) + "</span>"
        + "</span>" : "")
    + (alState.can_train ? "" : "<br>" + esc(alState.why_not || ""));
  $("train").disabled = !alState.can_train;
  setGradeButtons(gradeOf(current));
  $("gradestate").innerHTML = gradeState(current);
  if (alState.trained) await refreshSuggestions();
  saveLocal();
}

let myGrades = {};          // index -> grade, mirrored for the UI
function gradeOf(i) { return myGrades[i] || null; }

async function gradePose(value) {
  if (!canGradeNow()) return;
  try {
    alState = await bridge.call("grade", {index: current, value: value});
  } catch (e) {
    say("could not grade: " + esc(e.message), true);
    return;
  }
  myGrades[current] = value;
  await refreshAl();
  renderPoseOptions();
  if ($("opt-advance").checked) await advance();
}

async function advance() {
  for (const s of suggestions) {
    if (s.index !== current && s.index >= 0) { await analyse(s.index); return; }
  }
  if (current + 1 < poses.length) await analyse(current + 1);
}

async function refreshSuggestions() {
  let r;
  try {
    r = await bridge.call("predictions",
      {strategy: $("strategy").value, count: 20});
  } catch (e) { return; }
  if (!r.ready) { $("suggestbox").style.display = "none"; return; }
  suggestions = r.next || [];
  predicted = {};
  (r.rows || []).forEach((row) => { predicted[row.index] = row; });
  $("suggestbox").style.display = "";
  $("suggestions").innerHTML = suggestions.map((s) =>
    '<div class="srow' + (s.index === current ? " on" : "")
    + '" data-i="' + s.index + '"><span class="nm">' + esc(s.name)
    + '</span><span class="muted">' + s.grade.slice(0, 1)
    + " \u00b7 " + s.uncertainty.toFixed(3) + "</span></div>").join("")
    || '<p class="tiny muted">nothing left to suggest</p>';
  $("suggestions").querySelectorAll(".srow").forEach((el) => {
    el.onclick = () => analyse(+el.getAttribute("data-i"));
  });
  renderPoseOptions();
}

let predicted = {};         // index -> {grade, score, uncertainty}

// ------------------------------------------------------- party on disk
function saveLocal() {
  try {
    localStorage.setItem("hitpicking.grades", JSON.stringify(
      {file: files.lig ? files.lig.name : null, grades: myGrades}));
  } catch (e) { /* private window, or full: not worth failing over */ }
}
function restoreLocal() {
  try {
    const raw = localStorage.getItem("hitpicking.grades");
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!files.lig || d.file !== files.lig.name) return null;
    return d.grades || null;
  } catch (e) { return null; }
}

function download(name, text, mime) {
  const blob = new Blob([text], {type: mime || "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// The thing that leaves the building. The saved party is for carrying on
// later; this is the list you take to the meeting.
async function saveResultsCsv() {
  try {
    const r = await bridge.call("exportRows", {});
    const cols = r.columns;
    const lines = [cols.join(",")];
    r.rows.forEach((row) => {
      lines.push(cols.map((c) => csvCell(row[c])).join(","));
    });
    const base = (files.lig ? files.lig.name : "poses").replace(/\.[^.]+$/, "");
    download(base + "-hitpicking.csv", lines.join("\n"), "text/csv");
    say("wrote " + r.rows.length + " row(s)");
  } catch (e) {
    say("could not export: " + esc(e.message), true);
  }
}

async function savePartyFile() {
  try {
    const st = await bridge.call("saveParty", {});
    download("party.json", JSON.stringify(st), "application/json");
  } catch (e) {
    say("nothing to save yet: " + esc(e.message), true);
  }
}

async function loadPartyFile(file) {
  try {
    const r = await bridge.call("loadParty", {text: await file.text()});
    myGrades = {};
    say("restored " + r.restored + " grade(s)"
        + (r.unmatched ? " \u00b7 " + r.unmatched
           + " did not match a pose in this file" : ""),
        !!r.unmatched);
    await refreshAl();
    renderPoseOptions();
  } catch (e) {
    say("could not load that party: " + esc(e.message), true);
  }
}

// ------------------------------------------------------------ rendering

// The colour key, in the view rather than beside it.
//
// The line labels used to start with the interaction's name, which made
// them long enough to overlap each other on a crowded pocket while
// saying what the colour already said. The name moved here: it is read
// once, where you are looking, instead of being repeated on every line.
// Only what was actually drawn is listed - a key to things that are not
// on screen is clutter.
function renderLegend(scene) {
  const el = $("legend");
  if (!el) return;
  if (!$("opt-legend").checked || !scene) { el.hidden = true; return; }
  const named = new Map(TYPES);
  const kinds = new Set((scene.lines || []).map((l) => l.kind));
  const rows = [];
  TYPES.forEach((t) => {
    if (kinds.has(t[0])) {
      rows.push([t[1], hex(HPViewer.COLORS[t[0]] || 0x8b93a3)]);
    }
  });
  kinds.forEach((k) => {
    if (!named.has(k)) rows.push([k.replace(/_/g, " "), hex(0x8b93a3)]);
  });
  if ($("opt-clashes").checked && (scene.clashes || []).length) {
    rows.push(["clash", hex(HPViewer.CLASH)]);
    if (scene.clashes.some((c) => c.severe)) {
      rows.push(["severe clash", hex(HPViewer.SEVERE)]);
    }
  }
  if (torsionPick) rows.push(["picked torsion", hex(HPViewer.TORSION)]);
  el.innerHTML = rows.map((r) =>
    '<div class="lrow"><span class="swatch" style="background:' + r[1]
    + '"></span>' + esc(r[0]) + "</div>").join("");
  el.hidden = rows.length === 0;
}

function renderToggles() {
  // Ticked means "the core is computing this". Anything else is a
  // control that lies about what it controls.
  const on = new Set(enabled || (lastResult ? Object.keys(lastResult.counts) : []));
  $("toggles").innerHTML = TYPES.map((t) =>
    '<label class="chk"><input type="checkbox" data-kind="' + t[0] + '"'
    + (on.has(t[0]) ? " checked" : "") + ">"
    + '<span class="swatch" style="background:'
    + hex(HPViewer.COLORS[t[0]] || 0x8b93a3) + '"></span>'
    + t[1] + "</label>").join("");
  $("toggles").querySelectorAll("input[data-kind]").forEach((b) => {
    b.onchange = async () => {
      enabled = [...$("toggles").querySelectorAll("input[data-kind]")]
        .filter((x) => x.checked).map((x) => x.getAttribute("data-kind"));
      await analyse(current);
    };
  });
}
function syncToggles() {
  const on = new Set(enabled || []);
  $("toggles").querySelectorAll("input[data-kind]").forEach((b) => {
    b.checked = on.has(b.getAttribute("data-kind"));
  });
}

// The list has to show what you said and what the model thinks, or it is
// just a list of names - which is unusable past a few dozen poses.
function renderPoseOptions() {
  const sel = $("pose");
  const at = sel.value;
  sel.innerHTML = poses.map((n, i) => {
    const mine = gradeOf(i);
    const p = predicted[i];
    const mark = mine ? "[" + mine[0] + "] " : (p ? p.grade[0] + "  " : "   ");
    const sc = p ? "  " + p.score.toFixed(2) : "";
    return '<option value="' + i + '">' + mark + (i + 1) + ". "
      + esc(n) + sc + "</option>";
  }).join("");
  sel.value = at || String(current);
}

function renderPose(r) {
  const s = r.strain || {};
  const severe = (s.clashes || []).filter((c) => c.severe).length;
  let h = '<div class="card tiny"><b>' + esc(r.name) + "</b><div class='muted'>"
    + esc(r.summary) + "</div></div>";
  if (severe) {
    h += '<div class="card warn tiny"><b>' + severe + " severe clash"
      + (severe === 1 ? "" : "es") + "</b> &mdash; worst overlap "
      + (s.worst_overlap || 0).toFixed(2) + " Å</div>";
  }
  (r.warnings || []).forEach((w) => {
    h += '<div class="card warn tiny">' + esc(w) + "</div>";
  });
  $("pose-out").innerHTML = h;
}

// A handle on the page's own objects. `const` at the top level of a
// classic script is not a property of window, so without this the page
// cannot be driven from outside - which is how tools/check_web_viewer.py
// checks that what the core asked for is what actually got drawn.
window.HP = {
  get bridge() { return bridge; },
  analyse: (i) => analyse(i),
  redraw: redraw,
  explainAt: (xyz) => onAtomClick(xyz, "external"),
  viewer: () => viewer,
  state: () => ({poses: poses, current: current, result: lastResult,
                 enabled: enabled, al: alState, grades: myGrades,
                 suggestions: suggestions}),
  featuriseAll: featuriseAll,
  grade: (v) => gradePose(v),
  train: () => $("train").click(),
  refreshAl: refreshAl
};

// --------------------------------------------------------------- start

// Opened by double-clicking the file. Worth catching before anything
// else, because the failure three seconds later - a worker that cannot
// be constructed - reads like a broken page rather than a browser rule.
function fileProtocolNotice() {
  $("drop").innerHTML =
    "<div style='max-width:460px'><b style='color:var(--warn)'>This page "
    + "is open from a file, and a browser will not let a file run it."
    + "</b><br><br>Both the background worker and WebAssembly are blocked "
    + "for pages with no origin. That is a security rule; nothing on this "
    + "page can opt out of it.<br><br>Open the hosted copy instead &mdash; "
    + "it needs no install and it keeps working offline once you have "
    + "visited it once &mdash; or serve this folder:<br>"
    + "<code style='display:inline-block;margin-top:6px'>python "
    + "tools/serve_web.py</code></div>";
  $("drop").style.color = "var(--fg)";
  say("opened from file:// &mdash; a browser cannot run this page that way",
      true);
  $("go").disabled = true;
  $("rec").disabled = $("lig").disabled = true;
}

// Offline caching, for the HOSTED copy only.
//
// It used to register on localhost too, which cost two rounds of a very
// confusing bug: the cached page kept being served against newer code, so
// the script threw on markup that build no longer had. On localhost there
// is a server running by definition - caching buys nothing there and the
// staleness is a real cost. On https it is the whole point.
function registerOffline() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:") return;
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    window.__offline = reg;
  }).catch(function () { /* offline use is a bonus, not a requirement */ });
  // A new worker taking over means the files under it have changed.
  // Reload once, so the page you are looking at matches the code that
  // is now being served rather than half of each.
  var reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}

// An escape hatch: open ?fresh=1 and everything cached for this origin is
// dropped and the page reloads clean. Here because telling someone to go
// unregister a service worker in about:debugging is not a fix.
async function freshStart() {
  try {
    if ("serviceWorker" in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    }
    if (window.caches) {
      var names = await caches.keys();
      await Promise.all(names.map(function (n) { return caches.delete(n); }));
    }
  } catch (e) { /* nothing cached is also a clean state */ }
  location.replace(location.pathname);
}

(async function () {
  if (new URLSearchParams(location.search).get("fresh")) {
    await freshStart();
    return;
  }
  renderToggles();
  restoreView();
  if (location.protocol === "file:") { fileProtocolNotice(); return; }
  registerOffline();
  // Which build is on screen, stated rather than guessed at. Two bugs
  // were "the page is broken" when they were "the page is from a
  // different build than the code".
  try {
    const b = await (await fetch("build.js", {cache: "no-store"})).text();
    const m = b.match(/"([0-9a-f]+)"/);
    window.__build = m ? m[1] : "?";
  } catch (e) { window.__build = "?"; }
  $("build").textContent = "build " + String(window.__build).slice(0, 8);
  try {
    bridge = new HPBridge.WorkerBridge("js/worker.js");
    const v = await bridge.call("version");
    window.__handbook = v.handbook;
    $("build").title = "build " + (window.__build || "?")
      + "\n" + (v.handbook || "no handbook")
      + "\nMol* " + (window.molstar ? molstar.version : "missing")
      + "\neverything runs in this tab; nothing is uploaded";
    say("engine ready &middot; " + esc(v.handbook || "no handbook")
        + " &middot; Mol* " + (window.molstar ? molstar.version : "missing")
        + " &middot; <span class='muted'>everything runs in this tab</span>");
  } catch (e) {
    say("the engine failed to start: " + esc(e.message)
        + " &mdash; serve this folder: <code>python tools/serve_web.py</code>",
        true);
  }
})();
</script>
