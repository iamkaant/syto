schema_notes:
  version: '2026-11-17'
  extensions:
  - values[].compound
  - values[].acceptor_atom
  - values[].site_as_printed
  - values[].data_type
  - values[].flags
  - geometry.basis
  - geometry.ref
  - energy_kcal.ref
  - energy_kcal.note
  value_ranges: value may be a 2-element list [low, high]; null = open-ended bound
  compound_names: reproduced as printed in the source, including source spellings (e.g. Phtalazine, Phenantridine, Naphtalene, 2-Bromethanol,
    N,N-Dimethybenzenesulfinamide)
  si_pages: SI page numbers S1–S16 refer to jm801331y_si_001.pdf (16 pages); parts II (S3–S10) and III (S11–S16) are untitled tables
  flags_legend:
    crystal_statistics: CSD/PDB-derived, not a measurement
    gas_phase_only: gas-phase computation or experiment
    value_conflict: same quantity reported differently by two sources or two places in one source
    secondary_source: value read from a paper that compiled it from the primary database
    secondary_citation: number quoted in a review from another primary paper not accessed here
    read_from_image: transcribed from a scheme/table image by eye
    computed: computational estimate
  curation_status_legend:
    extracted: all values read from text/tables with no flags requiring review
    needs_review: contains crystal-statistics, gas-phase, conflicting, secondary or image-read values
  sources:
    10.1021/jm801331y: Laurence, Brameld, Graton, Le Questel, Renault. J. Med. Chem. 2009, 52, 4073 (+ SI jm801331y_si_001.pdf)
    10.1021/jm100112j: Bissantz, Kuhn, Stahl. J. Med. Chem. 2010, 53, 5061 (PMC2905122)
    10.1021/ci400657c: Green & Popelier. J. Chem. Inf. Model. 2014 (PMC4004274) — secondary compilation of pKBHX
    10.1021/ar300265y: Dougherty. Acc. Chem. Res. 2013 (PMC3957424)
    10.1021/acs.chemrev.5b00484: Cavallo et al. Chem. Rev. 2016 (PMC4768247)
entries:
- id: pkbhx_scale_definition
  title: 'pKBHX hydrogen-bond basicity scale: definition, range, classes'
  moiety_ids:
  - hba_any
  interaction_type: hbond_scale
  values:
  - quantity: pKBHX
    value: -0.96
    unit: dimensionless
    compound: 1,1,1,3,3,3-hexafluoro-2-propanol (weakest monofunctional neutral HBA in database v08.05)
    acceptor_atom: O
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: experimental_solution
    ref:
      doi: 10.1021/jm801331y
      locator: §4 'Description of the pKBHX Database', paragraph after Table 3
  - quantity: pKBHX
    value: 5.46
    unit: dimensionless
    compound: trimethylamine N-oxide (strongest monofunctional neutral HBA)
    acceptor_atom: O
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: experimental_solution
    ref:
      doi: 10.1021/jm801331y
      locator: §4, paragraph after Table 3; also Table 4
  - quantity: dG_per_pKBHX_unit
    value: -5.708
    unit: kJ/mol
    compound: 'conversion factor: ΔΔG° per ΔpKBHX at 298 K'
    conditions: 298 K; derived thermodynamic identity stated by authors
    data_type: definition
    ref:
      doi: 10.1021/jm801331y
      locator: §4, paragraph after Table 3 ('ΔΔG° = −RT ln 10 ΔpKBHX = −5.708 ΔpKBHX at 298 K')
  - quantity: pKBHX_mean
    value: 1.17
    unit: dimensionless
    compound: database mean (1338 values)
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: experimental_solution
    ref:
      doi: 10.1021/jm801331y
      locator: §4, paragraph after Table 3
  - quantity: class_very_weak
    value:
    - null
    - -0.7
    unit: pKBHX
    compound: very weak HBA (example cyclohexene −0.82)
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: classification
    ref:
      doi: 10.1021/jm801331y
      locator: Table 4
  - quantity: class_weak
    value:
    - -0.7
    - 0.5
    unit: pKBHX
    compound: weak HBA (example fluorocyclohexane −0.07)
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: classification
    ref:
      doi: 10.1021/jm801331y
      locator: Table 4
  - quantity: class_medium
    value:
    - 0.5
    - 1.8
    unit: pKBHX
    compound: medium HBA (example acetone 1.18)
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: classification
    ref:
      doi: 10.1021/jm801331y
      locator: Table 4
  - quantity: class_strong
    value:
    - 1.8
    - 3.0
    unit: pKBHX
    compound: strong HBA (example imidazole 2.41)
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: classification
    ref:
      doi: 10.1021/jm801331y
      locator: Table 4
  - quantity: class_very_strong
    value:
    - 3.0
    - null
    unit: pKBHX
    compound: very strong HBA (example trimethylamine N-oxide 5.46)
    conditions: 4-fluorophenol reference HBD, CCl4, 25 °C (298 K), FTIR; pKBHX = log10 K (L/mol) for 1:1 complex
    data_type: classification
    ref:
      doi: 10.1021/jm801331y
      locator: Table 4
  - quantity: max_basicity_gain_polar_solvent
    value: 4
    unit: kJ/mol
    compound: max solvent-induced basicity gain of sp2/sp3 N bases vs O and sp N bases (cyclohexane → 1,2-dichloroethane)
    conditions: 4-fluorophenol in solvents ε 2.02–10.36
    data_type: experimental_solution
    ref:
      doi: 10.1021/jm801331y
      locator: §3 'Domain of Validity', paragraph 2
  notes: 'Scale applies to OH, NH+ and strong NH donors (water; Ser/Thr/Tyr OH; Asn/Gln/Arg/His NH; backbone NH) — §3. CH donors and weak NH donors
    (amines, anilines, pyrroles) rank only O and sp-N bases consistently; sp2/sp3 N bases lose basicity relative to O bases as donor acidity falls.
    pKBHX does not correlate with aqueous pKBH+ across families (r² = 0.22, n = 232; §5). Database v08.05: 1338 values / 1164 HBAs. Note Table
    4 lists fluorocyclohexane −0.07 and imidazole 2.41, whereas SI part III lists 0.09 and 2.42 (see those entries). Open-ended class bounds are
    written as null.'
  curation_status: extracted
